[tool.poetry]
name = "booksstore"
version = "0.1.0"
description = "Bookstore API"
authors = ["Daniel Santos <drsantos20@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.9"
Django = "4.2.25"
djangorestframework = "^3.14.0"
django-extensions = "^3.1.3"
django-debug-toolbar = "^3.2.2"
dj-database-url = "^2.1.0"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.0"
whitenoise = "^6.6.0"
gunicorn = "^21.2.0"
gitpython = "^3.1.45"
mysqlclient = "^2.2.7"

[tool.poetry.dev-dependencies]
autopep8 = "^1.6.0"
isort = "^5.10.1"
flake8 = "^4.0.1"
pytest = "^6.2.5"
factory-boy = "^3.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=4.0.1,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]
